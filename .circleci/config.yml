version: 2.1

# Orbs for easier configuration
orbs:
  win: circleci/windows@5.0

jobs:
  # Build for Windows
  build-windows:
    executor:
      name: win/default
      size: medium
    
    steps:
      - checkout
      
      - run:
          name: Install Node.js 20
          command: |
            choco install nodejs --version=20.11.0 -y --force
            refreshenv
      
      - run:
          name: Verify Node Installation
          command: |
            node --version
            npm --version
      
      - run:
          name: Update npm
          command: npm install -g npm@10.2.5
      
      - run:
          name: Clear npm cache
          command: npm cache clean --force
      
      - run:
          name: Install Dependencies
          command: npm install --legacy-peer-deps
      
      - run:
          name: Install electron-builder
          command: npm install --save-dev electron-builder
      
      - run:
          name: Build Windows Application
          command: npm run build:win
          environment:
            CSC_IDENTITY_AUTO_DISCOVERY: false
      
      - run:
          name: List build outputs
          command: |
            dir dist
            echo "Listing all .exe files:"
            dir dist\*.exe /s
      
      - store_artifacts:
          path: dist
          destination: windows-builds
      
      - persist_to_workspace:
          root: .
          paths:
            - dist/*

workflows:
  version: 2
  build-windows-only:
    jobs:
      - build-windows
