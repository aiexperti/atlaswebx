version: 2.1

jobs:
  # Build for Windows using Docker with Wine (fastest option)
  build-windows:
    docker:
      - image: electronuserland/builder:wine
    
    resource_class: large
    
    steps:
      - checkout
      
      - run:
          name: Verify Node.js (pre-installed)
          command: |
            node --version
            npm --version
      
      - run:
          name: Install Dependencies
          command: npm install --legacy-peer-deps
      
      - run:
          name: Build Windows Application
          command: |
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npm run build:win
      
      - run:
          name: List build outputs
          command: |
            ls -lh dist/
            echo "Listing all .exe files:"
            find dist/ -name "*.exe" -type f
      
      - store_artifacts:
          path: dist
          destination: windows-builds
      
      - persist_to_workspace:
          root: .
          paths:
            - dist/*

workflows:
  version: 2
  build-windows-only:
    jobs:
      - build-windows
