<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Store</title>
    <link rel="stylesheet" href="appstore.css">
    <style>
        /* Window Controls Bar */
        .window-controls {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: #1a1a1a;
            border-bottom: 1px solid rgba(0, 0, 0, 0.3);
            -webkit-app-region: drag;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }
        
        /* Window Title */
        .window-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
        }
        
        /* Windows Controls (Right) */
        .windows-controls {
            display: flex;
            gap: 0;
            -webkit-app-region: no-drag;
        }
        
        .windows-button {
            width: 46px;
            height: 40px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .windows-button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        
        .windows-button.close-win:hover {
            background: #e81123;
            color: #fff;
        }
        
        .windows-button:active {
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div class="window-controls">
        <!-- Window Title (Center) -->
        <div class="window-title">App Store</div>
        
        <!-- Windows Controls (Right) -->
        <div style="width: 138px;"></div> <!-- Spacer for left side -->
        <div class="windows-controls">
            <button class="windows-button minimize-win" id="minimize-win-btn">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <rect x="0" y="5" width="12" height="1" fill="currentColor"/>
                </svg>
            </button>
            <button class="windows-button maximize-win" id="maximize-win-btn">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <rect x="1" y="1" width="10" height="10" stroke="currentColor" stroke-width="1" fill="none"/>
                </svg>
            </button>
            <button class="windows-button close-win" id="close-win-btn">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <path d="M1 1 L11 11 M11 1 L1 11" stroke="currentColor" stroke-width="1"/>
                </svg>
            </button>
        </div>
    </div>
    <div class="appstore-container">
        <!-- Header -->
        <header class="appstore-header">
            <div class="header-content">
                <div class="header-left">
                    <button class="back-btn" id="back-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <h1 class="header-title">App Store</h1>
                </div>
                <div class="header-right">
                    <div class="country-selector">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                        </svg>
                        <select id="country-select" class="country-select">
                            <option value="us">United States</option>
                            <option value="de">Germany</option>
                            <option value="gb">United Kingdom</option>
                            <option value="fr">France</option>
                            <option value="jp">Japan</option>
                            <option value="cn">China</option>
                            <option value="es">Spain</option>
                            <option value="it">Italy</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="search-container">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search apps...">
            </div>
        </header>

        <!-- Main Content -->
        <main class="appstore-main">
            <!-- Categories -->
            <section class="categories-section">
                <div class="section-header">
                    <h2 class="section-title">Categories</h2>
                </div>
                <div class="categories-grid">
                    <button class="category-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <path d="M9 3v18M3 9h18"/>
                        </svg>
                        Productivity
                    </button>
                    <button class="category-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        Social Networking
                    </button>
                    <button class="category-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="7" width="20" height="15" rx="2"/>
                            <polyline points="17 2 12 7 7 2"/>
                        </svg>
                        Photo & Video
                    </button>
                    <button class="category-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 18V5l12-2v13M9 13l12-2"/>
                            <circle cx="6" cy="18" r="3"/>
                            <circle cx="18" cy="16" r="3"/>
                        </svg>
                        Music
                    </button>
                    <button class="category-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        </svg>
                        News
                    </button>
                    <button class="category-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                            <line x1="7" y1="7" x2="7.01" y2="7"/>
                        </svg>
                        Lifestyle
                    </button>
                    <button class="category-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>
                        </svg>
                        Entertainment
                    </button>
                    <button class="category-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
                            <line x1="6" y1="1" x2="6" y2="4"/>
                            <line x1="10" y1="1" x2="10" y2="4"/>
                            <line x1="14" y1="1" x2="14" y2="4"/>
                        </svg>
                        Shopping
                    </button>
                </div>
            </section>

            <!-- Apps List -->
            <section class="apps-section">
                <div class="section-header">
                    <h2 class="section-title" id="apps-title">Top Free Apps</h2>
                    <div class="limit-selector">
                        <label for="limit-select">Show:</label>
                        <select id="limit-select" class="limit-select">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>
                
                <!-- Loading State -->
                <div class="loading-state" id="loading-state">
                    <div class="spinner"></div>
                    <p>Loading apps...</p>
                </div>

                <!-- Apps Grid -->
                <div class="apps-grid" id="apps-grid">
                    <!-- Apps will be dynamically loaded here -->
                </div>

                <!-- Error State -->
                <div class="error-state" id="error-state" style="display: none;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <p>Failed to load apps</p>
                    <button class="retry-btn" id="retry-btn">Retry</button>
                </div>
            </section>
        </main>

        <!-- App Detail Modal -->
        <div class="app-modal" id="app-modal" style="display: none;">
            <div class="modal-overlay" id="modal-overlay"></div>
            <div class="modal-content">
                <button class="modal-close" id="modal-close">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
                
                <div class="modal-body" id="modal-body">
                    <!-- App details will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="appstore.js"></script>
</body>
</html>
